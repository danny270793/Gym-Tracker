name: gym_tracker
description: "Weekly gym plan, workout log and progress dashboard."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# version: <user-visible version>+<monotonic build number>. See docs/versioning.md.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^18.0.2
  supabase_flutter: ^2.0.0
  get_it: ^9.3.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.0
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  http: ^1.6.0
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/launcher-ios.png
    - assets/certs/

# Icon artwork is drawn in code: scripts/icon/generate_icons_test.dart writes
# assets/launcher*.png and assets/splash_icon.png. After changing it run
#   asdf exec flutter test scripts/icon/generate_icons_test.dart
#   asdf exec dart run flutter_launcher_icons
#   asdf exec dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  # Legacy (pre-adaptive) Android icon uses the full-bleed artwork: the
  # transparent foreground's white dumbbell would vanish on light launchers.
  image_path_android: assets/launcher-ios.png
  image_path_ios: assets/launcher-ios.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#E64A19"
  adaptive_icon_foreground: assets/launcher.png
  adaptive_icon_monochrome: assets/launcher_monochrome.png
  # The artwork is already padded to the adaptive safe zone.
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#F4511E"
  image: assets/splash_icon.png
  color_dark: "#3E1A0C"
  image_dark: assets/splash_icon.png
  android_12:
    image: assets/splash_icon.png
    color: "#F4511E"
    image_dark: assets/splash_icon.png
    color_dark: "#3E1A0C"
  web: false
